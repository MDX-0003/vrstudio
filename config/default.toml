# vrstudio 默认配置（← vrpad config/default.toml 迁入，去掉 [aigc] 段——
# 平台参数归 vrgen 仓库）。
#
# 分层加载，优先级从高到低：
#   CLI --set key=value  >  --config FILE  >  ./vrstudio.toml  >  <程序目录>\vrstudio.toml
#   >  %APPDATA%\vrstudio\default.toml  >  ~/.config/vrstudio/default.toml  >  本文件（内置默认）
# --set 支持点号路径覆盖任意键，便于参数扫描。

schema = 1

# ── 路径 ───────────────────────────────────────────────────────────────
[paths]
# 可写数据根：cases / sources / vrgen_runs / logs 都在它下面。空 = 跟随程序目录
# （源码检出时就是仓库根）。安装版由安装器写成非系统盘绝对路径（决策 102）。
# 相对路径按程序目录解析。
data_root = ""

# ── pad ────────────────────────────────────────────────────────────────
[pad]
# 目标画布宽高比。这是唯一的旋钮：P（单侧循环冗余宽度）由它推导。
#   "21:9"  推荐。2:1 源 -> P = W/12 (8.33%/侧)；16:9 源 -> P = 5W/32 (15.63%/侧)
#   "16:9"  会重新引入垂直 padding（2:1 源凑 16:9 需每侧 23%），不建议
#   "auto"  取不小于源比例的下一个标准桶（逃生舱；可能与 AIGC 工具的原生桶不符）
target_aspect      = "21:9"
# 源在 pad 之前的预滚动量。"auto" = +P，使 recompose 的输出回到原始朝向。
# 注意：这一步必须在 pad 阶段做；放到 recompose 阶段会把 wrap 对推走。
pre_roll           = "auto"
on_aspect_conflict = "error"     # error | grow_canvas
even_dimensions    = true        # yuv420p 要求

# pad 的帧处理链（顺序即执行顺序，名字在 pipeline.TRANSFORMS 注册）
[pad.pipeline]
transforms = ["pre_roll", "pad_h"]

# ── mask ───────────────────────────────────────────────────────────────
[mask]
enabled         = true
strategy        = "redundant_white"   # redundant_white | content_white | tri_band
feather_px      = 0                   # 契约要求二值；>0 仅用于实验
png_compression = 0                   # 无损、无压缩杂色
path_template   = "{stem}_mask.png"

# ── recompose ──────────────────────────────────────────────────────────
[recompose]
registration       = "circular_translate"   # circular_translate | none
search_pct         = 25.0    # 搜索上限 = round(L * search_pct/100)，占 L 的百分比
d_star_mode        = "clip_median"          # clip_median | clip_mode | per_frame
per_frame_ema_alpha = 0.05   # 仅 d_star_mode="per_frame" 用；未平滑的逐帧 d* 必然闪烁
blend_weight       = "smoothstep"           # smoothstep | linear | cosine
endpoint_lock_pct  = 2.0     # 每端锁定的纯色宽度，占 L 的百分比（闭合保证）
restore_interp     = "lanczos4"
boundary_repair    = "off"                  # off | feather（红蓝 / 绿红过渡）
boundary_repair_pct = 15.0   # feather 时 T = max(8, round(L * pct/100))
max_sample_rows    = 256     # 配准粗搜索时纵向降采样到的行数（精度/速度权衡）
gate_max_frames    = 48      # 闸门段最多分析的帧数：按总帧数均匀抽样；0 = 分析全部帧。
                             # d* 是整段一个常量，闸门结论是段级的，逐帧配准不改变结论。
aspect_drift_warn_pct = 2.0  # 工具返回的宽高比与画布差多少就告警（输出仍是 WxH，
                             # 闭合是横向的，但内容会被拉伸）

# 配准 / 画布假设闸门
min_band_correlation = 0.60   # 对齐后蓝绿带的相关系数低于此值 -> ERROR 中止。
                              # 本质检验："两条带是不是同一段内容"。同内容 >= 0.95，
                              # 无关内容 ~0。对整体亮度梯度免疫（梯度只改均值）。
                              # 2026-11-02 决策 69 从 0.80 降到 0.60：AIGC 重绘后两端
                              # 轻微分岔（实测 0.73/0.78）也能出片，代价是高对比区域
                              # 可能重影。恢复原行为：改回 0.80，或在本机 vrstudio.toml
                              # 写 [recompose] min_band_correlation = 0.80。
warn_quality         = 1.15   # 代价曲线过平（mae_second/mae_min 低于此值）-> WARN：
                              # d* 可能是巧合匹配。视频裁回现在还会用相关峰仲裁
                              # （决策 94）：相关增益够大就仍然采纳 d*，而不是一律归零。

# ── verify ─────────────────────────────────────────────────────────────
[verify]
interior_band       = [0.25, 0.75]   # 取中间这段宽度当"正常"基线，避开边缘
max_wrap_percentile = 95     # wrap 百分位高于此值判坏
worst_interior_tol  = 1.0    # worst_interior 不得超过 before 的最差值 × (1+容忍)

# ── 输出视频 ────────────────────────────────────────────────────────────
# 全流程只产出一个交付档：HEVC Main10 10-bit yuv420p10le（决策 99）。
# 8-bit 的量化层次是大面积渐变出现色带的根因，降 crf 买不回来；帧泵因此按
# 16-bit（bgr48le）搬运。浏览器预览代理是唯一保留的 H.264 8-bit 产物。
[video]
encoder  = "libx265"
crf      = 14         # delivery 档；需要像素级对照时用 --set video.crf=0
preset   = "slow"
pix_fmt  = "yuv420p10le"  # 唯一合法值：HEVC Main10 10-bit
audio    = "copy"     # copy | none
metadata = "copy"

# ── manifest ───────────────────────────────────────────────────────────
[manifest]
path_template = "{stem}_pad.json"
write_hash    = true

# ── generate（跨仓库接缝：vrstudio → vrgen CLI 子进程）──────────────────
[generate]
# vrgen CLI 的可执行文件。跨仓库只走 CLI 契约（AGENTS.md 硬规则 1）。
# 同机开发最稳的写法是绝对路径，例如 "E:/VRAIGC/vrgen/.venv/Scripts/vrgen.exe"；
# 也支持本机 vrstudio.toml 覆盖或 --set generate.vrgen=...
vrgen    = "vrgen"
# vrgen 的台账根（runs/<job>/<轮次>/），相对仓库根。gitignore，不进 git。
workdir  = "vrgen_runs"
# 全幅提交给图片模型的副本长边上限（px）。平台上传接口对超大 PNG 返回 403，
# 而图片模型输出只有 4K；21:9 画布缩到 4K 再传，canonical pad 与最终 ERP 仍
# 保持源分辨率。0 表示不缩放。patchimg 的视口图不走这条，它的输入本来就是
# 16:9 裁剪。
image_upload_max_side = 4096
# 图片模型单次参考图的张数上限。mglc 的模型详情（`mglc model --type image
# --model-id 44`）报 maxReferenceCount = 13；换模型时按同一字段改这里，装配器
# 在提交前按它断言，超量直接本地报错，不花额度。
image_max_refs = 13

# ── web 控制台 ──────────────────────────────────────────────────────────
[web]
# 双击启动（不带子命令）时用的监听地址与端口。--host/--port/--lan 会临时覆盖它们；
# 想长期改端口，用 vrstudio config set web.port 8860 写进本机配置。
host = "127.0.0.1"
port = 8760
# 预览代理的宽度上限：选区页的全景代理与对比页的左右两路都按它缩放，
# 所有 4K 及更高分辨率的 VR 源共用这一个值（解码能力是机器级属性）。
# 远程桌面等软解环境播放卡顿时调低（如 2048）。进程启动时读取一次，改完
# 要重启 serve；重启后已有代理按新宽度自动重建。帧率保持与源一致——
# 帧同步要求，不能调。
proxy_max_w = 4096

# ── 外部二进制 ──────────────────────────────────────────────────────────
[bin]
dir                 = "bin"          # 相对仓库根
ffmpeg              = "ffmpeg.exe"
ffprobe             = "ffprobe.exe"
allow_path_fallback = false          # 分发版必须命中 bin/；开发期可设 true
