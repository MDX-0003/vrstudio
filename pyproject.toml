[project]
name = "vrstudio"
version = "0.1.0"
description = "360° 视频流程仓库：局部重绘（patch）与全景重绘（fullredraw）两条流程 + web 控制台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "numpy",
    "opencv-python",
    # M4 迁入 web 时追加 optional-dependencies: web = [starlette, uvicorn, jinja2]
]

[project.scripts]
vrstudio = "vrstudio.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# 迁入代码（← vrpad / vrpatch）按"原样搬运、行为零变化"原则豁免风格项；
# 新写代码（case/generate/media 合并层等）保持全量检查。
[tool.ruff.lint.per-file-ignores]
"src/vrstudio/redraw/**" = ["I", "E501", "E702", "E731", "B008", "B904", "B905", "B007", "B017", "F401", "F541", "F841", "UP"]
"src/vrstudio/patch/**" = ["I", "E501", "E702", "E731", "B008", "B904", "B905", "B007", "B017", "F401", "F541", "F841", "UP"]
