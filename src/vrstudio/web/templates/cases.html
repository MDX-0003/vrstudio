<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>vrstudio 控制台</title>
<style>
  /* 暖白主题（与向导页同一套色板） */
  body { font-family: system-ui, sans-serif; background: #faf6ef; color: #3d362c; margin: 1rem; }
  h1 { font-size: 1.1rem; margin: 0.2rem 0 0.8rem; color: #5a4a30; }
  .row { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; }
  .col { background: #ffffff; border: 1px solid #e7ddcc; border-radius: 8px; padding: 0.8rem; }
  h2 { font-size: 0.9rem; margin: 0.2rem 0 0.5rem; color: #7a5c33; }
  .case { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0.6rem;
          border-radius: 6px; cursor: pointer; }
  .case:hover { background: #f6f1e7; }
  .badge { font-size: 0.7rem; border-radius: 4px; padding: 0.05rem 0.4rem; }
  .badge.patch { background: #e3edf3; color: #3f6f92; }
  .badge.fullredraw { background: #f6e8d2; color: #a06b2c; }
  .badge.gen { background: #e8f0e4; color: #4f7343; }
  .case .name { font-weight: 600; }
  .case .st { font-size: 0.72rem; color: #8a7c66; }
  select, input { background: #fffdf8; color: #3d362c; border: 1px solid #d8cbb4;
                  border-radius: 4px; padding: 0.3rem; }
  button { background: #ead9b8; color: #3d362c; border: 1px solid #c2a066; border-radius: 4px;
           padding: 0.35rem 0.8rem; cursor: pointer; margin-top: 0.4rem; }
  button:hover:not(:disabled) { background: #e0c99c; }
  button:disabled { background: #f1ece3; color: #b3a992; border-color: #ddd3c0; cursor: not-allowed; }
  .meta { font-size: 0.78rem; color: #8a7c66; }
  #newCase { width: 320px; }
  #newCase label { display: block; font-size: 0.78rem; color: #8a7c66; margin-top: 0.5rem; }
  #newCase input, #newCase select { width: 100%; box-sizing: border-box; }
  .ok { color: #5a7d4a; } .bad { color: #b5533c; }
</style>
</head>
<body>
<h1>vrstudio 控制台</h1>
<div class="row">
  <div class="col" style="min-width:360px">
    <h2>case 列表</h2>
    <div id="cases"><span class="meta">加载中…</span></div>
  </div>
  <div class="col" id="newCase">
    <h2>新建 case</h2>
    <div class="meta" id="srcDir"></div>
    <label>流程</label>
    <select id="flowSel" onchange="onFlowChange()">
      <option value="gen">gen · 多素材生成（素材 → 生成）</option>
      <option value="patch">patch · 局部重绘</option>
      <option value="fullredraw">fullredraw · 全景重绘</option>
    </select>
    <label id="videoLabel">素材（sources/ 目录）</label>
    <select id="srcSel"></select>
    <label id="modeLabel" style="display:none">生成模式（gen 必选）</label>
    <select id="modeSel" style="display:none"></select>
    <label>case 名（gen 无视频时必填；其他流程缺省用素材名）</label>
    <input id="nameInput" placeholder="如 ship_01">
    <button onclick="createCase()">创建</button>
    <div class="meta" id="createMsg"></div>
  </div>
</div>
<script>
async function loadCases() {
  const r = await fetch("/api/cases");
  const cases = await r.json();
  const el = document.getElementById("cases");
  if (!cases.length) { el.innerHTML = '<span class="meta">还没有 case，从右侧新建一个</span>'; return; }
  el.innerHTML = "";
  for (const c of cases) {
    const div = document.createElement("div");
    div.className = "case";
    const steps = c.gates;
    const all = Object.values(steps);
    const done = all.filter(s => s.ok).length;
    div.innerHTML = `<span class="badge ${c.flow}">${c.flow}</span>` +
      `<span class="name">${c.name}</span>` +
      `<span class="st">${done}/${all.length} 步达成</span>`;
    div.onclick = () => { location.href = "/case/" + encodeURIComponent(c.name); };
    el.appendChild(div);
  }
}
async function loadSources() {
  const r = await fetch("/api/sources");
  const d = await r.json();
  document.getElementById("srcDir").textContent = d.dir;
  const sel = document.getElementById("srcSel");
  sel.innerHTML = '<option value="">（不选；gen 可在素材步骤添加）</option>' +
    (d.files.length ? d.files : []).map(f => `<option>${f}</option>`).join("");
  onFlowChange();
}
async function loadModes() {
  const sel = document.getElementById("modeSel");
  const msg = document.getElementById("createMsg");
  try {
    const r = await fetch("/api/modes");
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    const modes = d.modes || [];
    sel.innerHTML = modes.length
      ? modes.map(m => `<option value="${m.value}">${m.label || m.value}</option>`).join("")
      : '<option value="">（模型没有可用模式）</option>';
    msg.textContent = modes.length ? "" : "模型能力里没有本期支持的模式";
    msg.className = "meta";
  } catch (e) {
    sel.innerHTML = '<option value="">（模式列表获取失败）</option>';
    msg.textContent = "模式列表获取失败：" + (e.message || e);
    msg.className = "meta bad";
  }
}
function onFlowChange() {
  const gen = document.getElementById("flowSel").value === "gen";
  document.getElementById("modeLabel").style.display = gen ? "" : "none";
  document.getElementById("modeSel").style.display = gen ? "" : "none";
  document.getElementById("videoLabel").textContent =
    gen ? "视频（可选；创建后也可在素材步骤添加）" : "素材（sources/ 目录）";
  const sel = document.getElementById("srcSel");
  if (!gen && !sel.value && sel.options.length > 1) sel.selectedIndex = 1;
}
async function createCase() {
  const msg = document.getElementById("createMsg");
  const flow = document.getElementById("flowSel").value;
  const body = {
    flow,
    name: document.getElementById("nameInput").value.trim() || undefined,
  };
  if (flow === "gen") {
    body.mode = document.getElementById("modeSel").value;
    if (!body.mode) { msg.textContent = "先选择生成模式"; msg.className = "meta bad"; return; }
    const v = document.getElementById("srcSel").value;
    if (v && !v.startsWith("（")) body.video = v;
  } else {
    const v = document.getElementById("srcSel").value;
    if (!v || v.startsWith("（")) { msg.textContent = "先在 sources/ 放一个视频"; msg.className = "meta bad"; return; }
    body.video = v;
  }
  const r = await fetch("/api/cases", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) {
    msg.textContent = d.error;
    msg.className = "meta bad";
    if (d.created && d.name) msg.innerHTML += `（<a href="/case/${encodeURIComponent(d.name)}">打开已创建的 case</a>）`;
    return;
  }
  location.href = "/case/" + encodeURIComponent(d.name);
}
loadSources(); loadModes(); onFlowChange(); loadCases();
</script>
</body>
</html>
