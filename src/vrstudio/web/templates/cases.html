<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>vrstudio 控制台</title>
<style>
  body { font-family: system-ui, sans-serif; background: #141414; color: #ddd; margin: 1rem; }
  h1 { font-size: 1.1rem; margin: 0.2rem 0 0.8rem; }
  .row { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; }
  .col { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 0.8rem; }
  h2 { font-size: 0.9rem; margin: 0.2rem 0 0.5rem; color: #9c9; }
  .case { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0.6rem;
          border-radius: 6px; cursor: pointer; }
  .case:hover { background: #262626; }
  .badge { font-size: 0.7rem; border-radius: 4px; padding: 0.05rem 0.4rem; }
  .badge.patch { background: #2d4a5a; color: #9cf; }
  .badge.fullredraw { background: #4a3a2d; color: #fc9; }
  .case .name { font-weight: 600; }
  .case .st { font-size: 0.72rem; color: #888; }
  select, input { background: #222; color: #ddd; border: 1px solid #444;
                  border-radius: 4px; padding: 0.3rem; }
  button { background: #2d4a2d; color: #ddd; border: 1px solid #4a4; border-radius: 4px;
           padding: 0.35rem 0.8rem; cursor: pointer; margin-top: 0.4rem; }
  button:disabled { background: #222; color: #666; border-color: #444; cursor: not-allowed; }
  .meta { font-size: 0.78rem; color: #9a9; }
  #newCase { width: 320px; }
  #newCase label { display: block; font-size: 0.78rem; color: #9a9; margin-top: 0.5rem; }
  #newCase input, #newCase select { width: 100%; box-sizing: border-box; }
  .ok { color: #7c7; } .bad { color: #c77; }
</style>
</head>
<body>
<h1>vrstudio 控制台</h1>
<div class="row">
  <div class="col" style="min-width:360px">
    <h2>case 列表</h2>
    <div id="cases"><span class="meta">加载中…</span></div>
  </div>
  <div class="col" id="newCase">
    <h2>新建 case</h2>
    <div class="meta" id="srcDir"></div>
    <label>素材（sources/ 目录）</label>
    <select id="srcSel"></select>
    <label>流程</label>
    <select id="flowSel">
      <option value="patch">patch · 局部重绘</option>
      <option value="fullredraw">fullredraw · 全景重绘</option>
    </select>
    <label>case 名（缺省用素材名）</label>
    <input id="nameInput" placeholder="如 ship_01">
    <button onclick="createCase()">创建</button>
    <div class="meta" id="createMsg"></div>
  </div>
</div>
<script>
async function loadCases() {
  const r = await fetch("/api/cases");
  const cases = await r.json();
  const el = document.getElementById("cases");
  if (!cases.length) { el.innerHTML = '<span class="meta">还没有 case，从右侧新建一个</span>'; return; }
  el.innerHTML = "";
  for (const c of cases) {
    const div = document.createElement("div");
    div.className = "case";
    const steps = c.gates;
    const all = Object.values(steps);
    const done = all.filter(s => s.ok).length;
    div.innerHTML = `<span class="badge ${c.flow}">${c.flow}</span>` +
      `<span class="name">${c.name}</span>` +
      `<span class="st">${done}/${all.length} 步达成</span>`;
    div.onclick = () => { location.href = "/case/" + encodeURIComponent(c.name); };
    el.appendChild(div);
  }
}
async function loadSources() {
  const r = await fetch("/api/sources");
  const d = await r.json();
  document.getElementById("srcDir").textContent = d.dir;
  const sel = document.getElementById("srcSel");
  sel.innerHTML = (d.files.length ? d.files : ["（sources/ 是空的）"])
    .map(f => `<option>${f}</option>`).join("");
}
async function createCase() {
  const msg = document.getElementById("createMsg");
  const body = {
    video: document.getElementById("srcSel").value,
    flow: document.getElementById("flowSel").value,
    name: document.getElementById("nameInput").value.trim() || undefined,
  };
  const r = await fetch("/api/cases", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error; msg.className = "meta bad"; return; }
  location.href = "/case/" + encodeURIComponent(d.name);
}
loadSources(); loadCases();
</script>
</body>
</html>
