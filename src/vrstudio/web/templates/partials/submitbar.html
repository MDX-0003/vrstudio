<div id="submitBar">
  <div class="barRow">
    <span class="barLabel" id="settingsLabel" title="">生成设置</span>
    <label class="barCtl">模式
      <select id="genMode" onchange="onModeChange()"></select>
    </label>
    <label class="barCtl">比例
      <select id="genAspect" onchange="saveGenParams()"></select>
    </label>
    <label class="barCtl">输出分辨率
      <select id="genResolution" onchange="saveGenParams()"></select>
    </label>
    <label class="barCtl">输入分辨率
      <select id="genScale" onchange="saveGenParams()"></select>
    </label>
    <label class="barCtl">时长
      <select id="genDuration" onchange="renderGenParams(); renderSubmitBar()"></select>
    </label>
    <span class="meta bad" id="genParamsHint" style="display:none"></span>
    <span class="barActions">
      <button id="btnDryRun" onclick="runSubmit(true)"
        title="只做本地准备与参数检查，不提交、不扣费">预演检查（不扣费）</button>
      <button class="big" id="btnSubmit" onclick="runSubmit()">提交生成</button>
    </span>
  </div>
  <div class="barRow">
    <span class="barLabel" id="quotaLabel"
      title="个人额度不够时，选择项目、剧集与生成会话，提交会扣项目余额">扣费额度</span>
    <label class="barCtl">项目
      <select id="sessProject" onchange="onProjectChange()"></select>
    </label>
    <label class="barCtl">剧集
      <select id="sessEpisode" onchange="onEpisodeChange()"></select>
    </label>
    <label class="barCtl">会话
      <select id="sessSession" onchange="onSessionChange()"></select>
    </label>
    <button id="sessRefresh" onclick="loadSessions()">刷新</button>
    <span class="meta" id="sessionHint"></span>
    <span class="barStatus" id="barStatus"></span>
  </div>
  <span id="genFixed" hidden></span>
</div>
