<h3>生成参数</h3>
<div class="row" style="align-items:center">
  <label class="meta">生成模式
    <select id="genMode" onchange="onModeChange()"></select>
  </label>
  <label class="meta">输出比例
    <select id="genAspect" onchange="saveGenParams()"></select>
  </label>
  <label class="meta">输出分辨率
    <select id="genResolution" onchange="saveGenParams()"></select>
  </label>
  <label class="meta">输入分辨率
    <select id="genScale" onchange="saveGenParams()"></select>
  </label>
</div>
<div class="meta" id="genFixed"></div>
<div class="meta bad" id="genParamsHint" style="display:none"></div>
