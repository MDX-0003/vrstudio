<details id="promptPanel" class="fold">
  <summary>提示词 <span class="sum" id="promptSummary"></span></summary>
  <div class="meta">完整提示词已代入当前变量、素材角色、生成模式与画布尺寸；
    模板骨架可以切换查看。变量改动会自动保存并刷新预览。</div>

  <details id="promptPreviewFold" class="fold inner" open>
    <summary>完整提示词 <span class="sum" id="promptPreviewSummary"></span></summary>
    <div class="row promptActions">
      <button id="promptToggle" onclick="togglePromptView()">查看模板骨架</button>
      <span class="meta" id="promptViewState">完整预览</span>
    </div>
    <pre id="promptBox">（加载中）</pre>
  </details>

  <div id="varList"></div>

  <details id="addVarFold" class="fold inner">
    <summary>＋ 添加变量</summary>
    <div class="row" style="align-items:center">
      <input id="newVarKey" placeholder="新变量名（英文）" style="width:170px">
      <input id="newVarVal" placeholder="新变量的值" style="width:300px">
      <button onclick="addVar()">添加变量</button>
    </div>
  </details>
</details>
