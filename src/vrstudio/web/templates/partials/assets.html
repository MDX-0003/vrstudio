<details id="assetSidebar" class="fold" open>
  <summary>素材库与本次视频提交 <span class="sum" id="assetSummary"></span></summary>
  <div class="meta">素材库存放本 case 的文件（三视图、首尾定稿、其他参考图）；这里的勾选只表示
    「参与本次视频生成」，没有默认集。图片步的参考图由「首尾帧」步骤自己决定，不受这里的勾选影响。
    流程母版（patch 的 clip、fullredraw 的 pad）与文件素材同为主要候选；mask 由流程自动附加，
    不出现在候选里。提示词里的 @VideoN / @ImageN 按勾选结果重新编号。</div>

  <div class="row" style="align-items:center;margin:0.4rem 0">
    <button onclick="_setAllSelected(true)">全选</button>
    <button onclick="_setAllSelected(false)">全不选</button>
    <button onclick="_invertSelection()">反选</button>
    <span class="meta">母版排在最前；视频在前、图片在后编号。</span>
  </div>

  <div id="assetList"><span class="meta">还没有素材</span></div>
  <div class="row" style="align-items:center;margin:0.4rem 0" id="assetAddRow">
    <button class="big" onclick="openAssetBrowse()">添加视频或图片</button>
    <span class="meta" id="assetHint"></span>
  </div>
  <div class="meta" id="submitHint"></div>

  <div class="fstage">不参与提交的流程文件</div>
  <div id="derivedList"><span class="meta">（还没有流程产物）</span></div>
</details>

<div id="assetBrowseBox">
  <b>选择素材文件</b>
  <button style="float:right" onclick="closeAssetBrowse()">×</button>
  <div class="meta">可以多选；选好后为每个文件指定角色，再点“添加”。</div>
  <div class="meta" id="abPath"></div>
  <div id="abList" style="max-height:260px;overflow-y:auto"></div>
  <div id="abSelected" style="margin-top:0.4rem"></div>
  <button onclick="submitAssetAdd()">添加选中素材</button>
</div>
