<details id="assetSidebar" open>
  <summary>素材与本次提交集</summary>
  <div class="meta">勾选的素材参与本次提交；提示词里的 @VideoN / @ImageN 会按勾选结果重新编号。
    流程产物（源视频、clip、pad 画布）是只读派生条目，不复制、不进素材列表。</div>

  <div class="fstage">流程产物（派生 · 只读）</div>
  <div id="derivedList"><span class="meta">（还没有流程产物）</span></div>

  <div class="fstage">文件素材</div>
  <div id="assetList"><span class="meta">还没有素材</span></div>
  <div class="row" style="align-items:center;margin:0.4rem 0" id="assetAddRow">
    <button class="big" onclick="openAssetBrowse()">添加视频或图片</button>
    <span class="meta" id="assetHint"></span>
  </div>
  <div class="row" style="align-items:center;margin:0.3rem 0" id="assetExtractRow">
    <button onclick="extractFrames()">从当前 clip 抽首尾原始帧</button>
    <span class="meta">按 clip 原始分辨率导出，不缩放；抽出的帧可用于工作台输入。</span>
  </div>
  <div class="meta" id="submitHint"></div>
</details>

<div id="assetBrowseBox">
  <b>选择素材文件</b>
  <button style="float:right" onclick="closeAssetBrowse()">×</button>
  <div class="meta">可以多选；选好后为每个文件指定角色，再点“添加”。</div>
  <div class="meta" id="abPath"></div>
  <div id="abList" style="max-height:260px;overflow-y:auto"></div>
  <div id="abSelected" style="margin-top:0.4rem"></div>
  <button onclick="submitAssetAdd()">添加选中素材</button>
</div>
